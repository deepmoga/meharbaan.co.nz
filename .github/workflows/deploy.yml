name: Deploy to meharbaan.co.nz

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            echo "=== Starting Deploy ==="
            # Find app directory automatically
            APP_DIR=$(find /home /var/www /root -name "package.json" -path "*meharbaan*" 2>/dev/null | head -1 | xargs dirname 2>/dev/null || echo "")
            if [ -z "$APP_DIR" ]; then
              APP_DIR=$(find /home /var/www -name ".next" -maxdepth 5 2>/dev/null | head -1 | xargs dirname 2>/dev/null || echo "")
            fi
            if [ -z "$APP_DIR" ]; then
              echo "ERROR: Could not find app directory"
              exit 1
            fi
            echo "Found app at: $APP_DIR"
            cd "$APP_DIR"
            echo "=== Pulling latest code ==="
            git pull origin main
            echo "=== Installing dependencies ==="
            npm ci --production=false
            echo "=== Building ==="
            npm run build
            echo "=== Restarting app ==="
            if command -v pm2 &>/dev/null; then
              pm2 restart all || pm2 start npm --name meharbaan -- start
            else
              systemctl restart meharbaan 2>/dev/null || \
              service meharbaan restart 2>/dev/null || \
              echo "App restarted (check your server process manager)"
            fi
            echo "=== Deploy Complete ==="
